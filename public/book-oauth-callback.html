<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Patzer Pro Lichess Book Login</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111;
      color: #ddd;
      font: 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      max-width: 28rem;
      padding: 1.5rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <h1>Connecting Lichess</h1>
    <p>You can close this window if it does not close automatically.</p>
  </main>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const payload = {
        type: 'patzer:book-oauth-callback',
        code: params.get('code'),
        state: params.get('state'),
        error: params.get('error') || params.get('error_description'),
      };
      try {
        window.localStorage.setItem('patzer.lichess.bookOAuthCallback', JSON.stringify(payload));
      } catch {
        // The opener postMessage path below is the primary same-origin handoff.
      }
      const notifyOpener = () => {
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage(payload, window.location.origin);
        }
      };
      notifyOpener();
      window.setTimeout(notifyOpener, 150);
      window.setTimeout(() => {
        window.close();
      }, 1000);
      window.addEventListener('pagehide', () => {
        try {
          window.localStorage.setItem('patzer.lichess.bookOAuthCallback', JSON.stringify(payload));
        } catch {
          // The opener postMessage path above is the primary same-origin handoff.
        }
      }, { once: true });
    })();
  </script>
</body>
</html>
