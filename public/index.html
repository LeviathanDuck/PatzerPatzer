  <script data-patzer-appearance-prepaint>
    (() => {
      let saved = 'dark';
      try {
        const value = window.localStorage.getItem('patzer.appearance.v1');
        if (value === 'dark' || value === 'light' || value === 'system') saved = value;
      } catch {}
      let theme = saved === 'light' ? 'light' : 'dark';
      if (saved === 'system') {
        try {
          if (window.matchMedia?.('(prefers-color-scheme: light)')?.matches) theme = 'light';
        } catch {}
      }
      const root = document.documentElement;
      root.dataset.appearance = saved;
      root.dataset.theme = theme;
      root.style.colorScheme = theme;
      document.querySelector('meta[name="theme-color"]')
        ?.setAttribute('content', theme === 'light' ? '#f3efe6' : '#101212');
      document.querySelector('meta[name="color-scheme"]')?.setAttribute('content', theme);
    })();
  </script>
