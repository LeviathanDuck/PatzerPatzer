<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patzer Pro Logo Preview</title>
<style>
body{margin:0;background:#101212;color:#F3F4EF;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:40px} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}.card{background:#171A1A;border:1px solid #2B302F;border-radius:22px;padding:24px;min-height:220px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px}.light{background:#F3F4EF;color:#101212}.card img{max-width:100%;height:auto}.small img{width:96px} h1{letter-spacing:-.04em}.label{color:#9AA09E;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.12em}
</style></head><body>
<h1>Patzer Pro Review Lens Logo</h1>
<div class="grid">
<div class="card"><img src="svg/patzerpro-app-icon.svg" width="180"><div class="label">App icon</div></div>
<div class="card small"><img src="svg/patzerpro-mark-dark-ui.svg"><div class="label">Mark / dark UI</div></div>
<div class="card light small"><img src="svg/patzerpro-mark-light-ui.svg"><div class="label">Mark / light UI</div></div>
<div class="card"><img src="svg/patzerpro-lockup-horizontal-dark-ui.svg"><div class="label">Horizontal / dark UI</div></div>
<div class="card light"><img src="svg/patzerpro-lockup-horizontal-light-ui.svg"><div class="label">Horizontal / light UI</div></div>
<div class="card"><img src="svg/patzerpro-lockup-stacked-dark-ui.svg" width="300"><div class="label">Stacked</div></div>
</div>
</body></html>
