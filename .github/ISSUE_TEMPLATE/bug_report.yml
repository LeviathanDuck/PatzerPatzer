name: Bug report
description: Report reproducible Chess Patzer product behavior without private data.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Chess Patzer. Describe only public product behavior. Do not paste diagnostics or operational details.
  - type: input
    id: version
    attributes:
      label: Chess Patzer version
      description: Copy the public version shown in the app. Do not include a deployment identifier or private commit.
      placeholder: "Example: 0.0.2"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Product area
      options:
        - Analysis
        - Games
        - Puzzles
        - Study
        - Openings or Repertoire
        - Account or Sync
        - Other public product area
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser class
      options:
        - Safari
        - Chrome or Chromium
        - Firefox
        - Installed mobile app
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use a minimal generic example. Do not include account names, game links, game notation, logs, or copied requests.
      placeholder: |
        1. Open the public product area
        2. Choose the relevant visible control
        3. Observe the behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy_acknowledgement
    attributes:
      label: Public-report privacy check
      description: Public issues are visible to everyone and may be copied or archived.
      options:
        - label: I confirm this report contains no credentials, authorization material, private identifiers, PGN/FEN or move records, raw logs or payloads, screenshots or attachments, local computer paths, or hosting and deployment details.
          required: true
